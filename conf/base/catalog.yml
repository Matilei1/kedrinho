# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html
weatherAus:
  type: pandas.CSVDataset
  filepath: ../notebooks/weatherAUS.csv
  load_args:
    sep: ','
  save_args:
    index: False
    date_format: '%Y-%m-%d %H:%M'
    decimal: .
  
# El dataset limpio (después de la limpieza de localidades)
cleaned_weatherAUS:
  type: pandas.CSVDataset
  filepath: data/03_primary/cleaned_weatherAUS.csv
  save_args:
    index: False

# Dataset con valores nulos rellenos con la mediana
weatherAUS_filled:
  type: pandas.CSVDataset
  filepath: data/03_primary/weatherAUS_filled.csv
  save_args:
    index: False